                        <div className="flex flex-wrap gap-2">
                          {project.techStack.map((tech, idx) => (
                            <span key={idx} className="text-xs font-mono font-medium px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                              {tech}
                            </span>
                          ))}
                        </div>
                      </div>

                      {isExpanded && (
                        <div className="px-6 pb-8 sm:px-8 pt-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/70">
                          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div className="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                              <div className="text-mint-600 dark:text-mint-400 font-bold text-xs uppercase mb-2">Layers</div>
                              <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">{project.architecture.layers}</p>
                            </div>
                            <div className="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                              <div className="text-emerald-600 dark:text-emerald-400 font-bold text-xs uppercase mb-2">Database</div>
                              <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">{project.architecture.database}</p>
                            </div>
                            <div className="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                              <div className="text-teal-600 dark:text-teal-400 font-bold text-xs uppercase mb-2">QA & Testing</div>
                              <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">{project.architecture.testingScope}</p>
                            </div>
                          </div>

                          <div className="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                            <h4 className="font-bold text-slate-900 dark:text-white text-xs uppercase mb-3">Key Deliverables</h4>
                            <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                              {project.highlights.map((highlight, hIdx) => (
                                <li key={hIdx} className="flex items-start gap-2 text-xs text-slate-600 dark:text-slate-300">
                                  <span className="w-1.5 h-1.5 rounded-full bg-mint-500 mt-1.5 flex-shrink-0" />
                                  <span>{highlight}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          {/* Experience Section */}
          <section id="experience" className="py-20 bg-slate-50/60 dark:bg-slate-900/40">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-mint-50 dark:bg-mint-950/60 border border-mint-200 dark:border-mint-800 text-mint-700 dark:text-mint-300 text-xs font-semibold mb-3">
                  <span>{d.experience.badge}</span>
                </div>
                <h2 className="text-2xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-3">
                  {d.experience.title}
                </h2>
                <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400">
                  {d.experience.subtitle}
                </p>
              </div>

              <div className="relative border-l-2 border-mint-200 dark:border-mint-900 ml-4 sm:ml-8 space-y-10">
                {d.experience.items.map((item, index) => (
                  <div key={index} className="relative pl-6 sm:pl-8 group">
                    <div className="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full bg-white dark:bg-slate-900 border-2 border-mint-500 shadow-sm" />
                    <div className="p-6 sm:p-7 rounded-3xl bg-white dark:bg-slate-850 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:border-mint-400 transition-all">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                        <div>
                          <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-mint-50 dark:bg-mint-950 text-mint-700 dark:text-mint-300 border border-mint-200 dark:border-mint-800 inline-block mb-1.5">
                            {item.type}
                          </span>
                          <h3 className="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">
                            {item.role}
                          </h3>
                          <div className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                            {item.company}
                          </div>
                        </div>
                        <div className="text-xs font-mono font-medium px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                          {item.period}
                        </div>
                      </div>
                      <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-4 leading-relaxed">
                        {item.description}
                      </p>
                      <div className="space-y-2 mb-5">
                        {item.responsibilities.map((resp, rIdx) => (
                          <div key={rIdx} className="flex items-start gap-2 text-xs text-slate-600 dark:text-slate-300">
                            <Icons.CheckCircle2 />
                            <span>{resp}</span>
                          </div>
                        ))}
                      </div>
                      <div className="pt-4 border-t border-slate-100 dark:border-slate-800 flex flex-wrap gap-1.5">
                        {item.skillsGained.map((skill, sIdx) => (
                          <span key={sIdx} className="text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                            {skill}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Education Section */}
          <section id="education" className="py-20 bg-white dark:bg-[#0B0F19]">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-mint-50 dark:bg-mint-950/60 border border-mint-200 dark:border-mint-800 text-mint-700 dark:text-mint-300 text-xs font-semibold mb-3">
                  <span>{d.education.badge}</span>
                </div>
                <h2 className="text-2xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-3">
                  {d.education.title}
                </h2>
                <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400">
                  {d.education.subtitle}
                </p>
              </div>

              {/* Degree Card */}
              <div className="mb-12 p-6 sm:p-8 rounded-3xl bg-gradient-to-br from-mint-500/10 via-emerald-500/5 to-transparent border border-mint-200/80 dark:border-mint-900/60 glass-card">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-wider text-mint-600 dark:text-mint-400">
                      {d.education.university.grade}
                    </span>
                    <h3 className="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-white">
                      {d.education.university.degree}
                    </h3>
                    <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-400 font-medium">
                      {d.education.university.institution}
                    </p>
                  </div>
                  <div className="px-4 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold border border-slate-200 dark:border-slate-700">
                    {d.education.university.graduation}
                  </div>
                </div>
                <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed border-t border-mint-200/40 dark:border-mint-900/40 pt-4">
                  {d.education.university.highlights}
                </p>
              </div>

              {/* Tracks */}
              <h3 className="text-lg sm:text-xl font-bold text-slate-900 dark:text-white mb-6">
                {d.education.tracksTitle}
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {d.education.tracks.map((track, idx) => (
                  <div key={idx} className="p-6 rounded-3xl bg-slate-50 dark:bg-slate-850 border border-slate-200/80 dark:border-slate-800 hover:border-mint-400 transition-all">
                    <span className="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-mint-50 dark:bg-mint-950 text-mint-700 dark:text-mint-300 border border-mint-200 dark:border-mint-800 inline-block mb-2">
                      {track.org}
                    </span>
                    <h4 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white mb-1">
                      {track.name}
                    </h4>
                    <p className="text-xs sm:text-sm font-semibold text-mint-600 dark:text-mint-400 mb-3">
                      {track.track}
                    </p>
                    <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                      {track.desc}
                    </p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Certifications Section */}
          <section id="certifications" className="py-20 bg-slate-50/60 dark:bg-slate-900/40">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-mint-50 dark:bg-mint-950/60 border border-mint-200 dark:border-mint-800 text-mint-700 dark:text-mint-300 text-xs font-semibold mb-3">
                  <span>{d.certifications.badge}</span>
                </div>
                <h2 className="text-2xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-3">
                  {d.certifications.title}
                </h2>
                <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400">
                  {d.certifications.subtitle}
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                {d.certifications.items.map((cert, index) => (
                  <div key={index} className="p-6 rounded-3xl bg-white dark:bg-slate-850 border border-slate-200/80 dark:border-slate-800 hover:border-mint-400 shadow-sm transition-all flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-4">
                        <span className="w-10 h-10 rounded-2xl bg-mint-50 dark:bg-mint-950 text-mint-600 dark:text-mint-400 flex items-center justify-center border border-mint-200 dark:border-mint-800">
                          <Icons.Landmark />
                        </span>
                        <span className="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-200 dark:border-emerald-800">
                          ✓ {lang === 'ar' ? 'معتمد' : 'Verified'}
                        </span>
                      </div>
                      <h3 className="font-bold text-slate-900 dark:text-white text-base mb-1.5">
                        {cert.name}
                      </h3>
                      <p className="text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">
                        {cert.issuer}
                      </p>
                    </div>
                    <div className="pt-3 border-t border-slate-100 dark:border-slate-800 text-xs text-mint-600 dark:text-mint-400 font-medium">
                      {cert.category}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Contact Section */}
          <section id="contact" className="py-20 bg-white dark:bg-[#0B0F19]">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-mint-50 dark:bg-mint-950/60 border border-mint-200 dark:border-mint-800 text-mint-700 dark:text-mint-300 text-xs font-semibold mb-3">
                  <span>{d.contact.badge}</span>
                </div>
                <h2 className="text-2xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-3">
                  {d.contact.title}
                </h2>
                <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400">
                  {d.contact.subtitle}
                </p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
                {/* Channels */}
                <div className="lg:col-span-5 space-y-6">
                  <div className="p-6 sm:p-8 rounded-3xl bg-slate-50 dark:bg-slate-850 border border-slate-200/80 dark:border-slate-800 shadow-sm">
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4">
                      {d.contact.directChannels}
                    </h3>
                    <div className="space-y-4">
                      {d.contact.quickConnect.map((channel, idx) => (
                        <a
                          key={idx}
                          href={channel.href}
                          target={channel.href.startsWith('http') ? '_blank' : undefined}
                          rel="noopener noreferrer"
                          className="flex items-center justify-between p-3.5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-mint-400 transition-all cursor-pointer"
                        >
                          <div>
                            <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider">{channel.label}</div>
                            <div className="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-200" dir="ltr">{channel.value}</div>
                          </div>
                          <Icons.Send />
                        </a>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Form */}
                <div className="lg:col-span-7">
                  <div className="p-6 sm:p-8 rounded-3xl bg-slate-50 dark:bg-slate-850 border border-slate-200/80 dark:border-slate-800 shadow-sm">
                    {formStatus === 'success' && (
                      <div className="mb-6 p-4 rounded-2xl bg-mint-50 dark:bg-mint-950 border border-mint-300 dark:border-mint-800 text-mint-800 dark:text-mint-200 flex items-center gap-3">
                        <Icons.CheckCircle2 />
                        <div>
                          <h5 className="font-bold text-sm">{d.contact.form.successTitle}</h5>
                          <p className="text-xs opacity-90">{d.contact.form.successDesc}</p>
                        </div>
                      </div>
                    )}

                    <form onSubmit={handleFormSubmit} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                            {d.contact.form.nameLabel} *
                          </label>
                          <input
                            type="text"
                            required
                            value={formData.name}
                            onChange={(e) => setFormData(prev => ({ ...prev, name: e.target.value }))}
                            placeholder={d.contact.form.namePlaceholder}
                            className="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-800 dark:text-white focus:ring-2 focus:ring-mint-500/30 focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                            {d.contact.form.emailLabel} *
                          </label>
                          <input
                            type="email"
                            required
                            value={formData.email}
                            onChange={(e) => setFormData(prev => ({ ...prev, email: e.target.value }))}
                            placeholder={d.contact.form.emailPlaceholder}
                            className="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-800 dark:text-white focus:ring-2 focus:ring-mint-500/30 focus:outline-none"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                          {d.contact.form.subjectLabel}
                        </label>
                        <input
                          type="text"
                          value={formData.subject}
                          onChange={(e) => setFormData(prev => ({ ...prev, subject: e.target.value }))}
                          placeholder={d.contact.form.subjectPlaceholder}
                          className="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-800 dark:text-white focus:ring-2 focus:ring-mint-500/30 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                          {d.contact.form.messageLabel} *
                        </label>
                        <textarea
                          rows={4}
                          required
                          value={formData.message}
                          onChange={(e) => setFormData(prev => ({ ...prev, message: e.target.value }))}
                          placeholder={d.contact.form.messagePlaceholder}
                          className="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-800 dark:text-white focus:ring-2 focus:ring-mint-500/30 focus:outline-none resize-none"
                        />
                      </div>

                      <button
                        type="submit"
                        disabled={formStatus === 'sending'}
                        className="w-full sm:w-auto px-8 py-3 rounded-full bg-mint-500 hover:bg-mint-600 text-white text-xs sm:text-sm font-semibold transition-all shadow-md hover:shadow-mint-500/25 flex items-center justify-center gap-2 glow-mint cursor-pointer"
                      >
                        <Icons.Send />
                        <span>{formStatus === 'sending' ? d.contact.form.sending : d.contact.form.submitBtn}</span>
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="py-12 bg-slate-100/80 dark:bg-slate-950 border-t border-slate-200/80 dark:border-slate-850">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-6">
                <div>
                  <div className="flex items-center justify-center sm:justify-start gap-2 font-bold text-slate-800 dark:text-white">
                    <span className="w-7 h-7 rounded-full bg-mint-500 flex items-center justify-center text-white text-xs font-black">
                      AH
                    </span>
                    <span>Aya Hazem Shawky</span>
                  </div>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1.5">
                    © {new Date().getFullYear()} Aya Hazem Shawky. {d.footer.rights}
                  </p>
                </div>

                <button
                  onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                  className="flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-mint-500 hover:bg-mint-600 text-white text-xs font-semibold transition-all shadow-md cursor-pointer"
                >
                  <span>{d.footer.backToTop}</span>
                  <Icons.ArrowUp />
                </button>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
